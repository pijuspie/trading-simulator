<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Simulator | Stock List</title>

    <link rel="stylesheet" href="/main.css">
</head>

<body>
    <header class="header">
        <div>
            <h1>Trading Simulator</h1>
            <nav id="navbar">
                <a href="/" class="active">Stocks</a>
                <a href="/history">History</a>
                <a href="/signup">Sign up</a>
                <a href="/login">Log in</a>
                <a href="/projects" class="hidden">Projects</a>
                <a href="/profile" class="hidden">Profile</a>
                <button type="button" onclick="logout()" class="hidden">Log out</button>
            </nav>
        </div>
    </header>

    <main class="main">
        <div>
            <h2>Stock list</h2>
            <form onsubmit="filter(event)" class="block">
                <input placeholder="Stock name or ticker" name="search" />
                <button type="submit">Search</button>
            </form>
            <table class="block">
                <thead>
                    <tr>
                        <th>Ticker</th>
                        <th>Stock name</th>
                        <th>Change</th>
                        <th>Price</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="stocks">
                </tbody>
            </table>
        </div>
    </main>

    <template id="stockRow">
        <tr class="stock">
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td class="inspectButton"><a href="">Inspect</a></td>
        </tr>
    </template>

    <script>
        function filter(event) {
            event.preventDefault();
            const search = event.target[0].value.toLowerCase();
            const stocks = document.getElementsByClassName("stock");

            for (let i = 0; i < stocks.length; i++) {
                const stock = stocks[i];
                const ticker = stock.children[0].textContent.toLowerCase();
                const name = stock.children[1].textContent.toLowerCase();
                if (name.includes(search) || ticker.includes(search)) {
                    stock.classList.remove("hidden");
                } else {
                    stock.classList.add("hidden");
                }
            }
        }

        async function downloadStocks() {
            const response = await fetch("/api/stocks");
            const stocks = await response.json();

            const container = document.getElementById("stocks");
            const template = document.getElementById("stockRow");
            stocks.forEach(stock => {
                const newRow = template.content.cloneNode(true);
                const cells = newRow.children[0].children;
                cells[0].textContent = stock.ticker;
                cells[1].textContent = stock.name;
                cells[2].textContent = stock.change;
                cells[3].textContent = stock.price;
                cells[4].children[0].setAttribute("href", "/history/?stock=" + stock.ticker);
                container.appendChild(newRow);
            });
        }

        async function checkStatus() {
            const response = await fetch("/api/status");
            const status = await response.json();
            if (status.loggedIn) {
                const links = document.getElementById("navbar").children;
                links[2].classList.add("hidden");
                links[3].classList.add("hidden");
                links[4].classList.remove("hidden");
                links[5].classList.remove("hidden");
                links[6].classList.remove("hidden");
            }
        }

        async function logout() {
            fetch("/api/logout")
                .then(() => window.location.href = "/")
                .catch(error => console.log(error));
        }

        downloadStocks();
        checkStatus();
    </script>
</body>

</html>
